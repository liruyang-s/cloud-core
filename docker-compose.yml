version: "3.8"

# 一键拉起所有中间件：docker-compose up -d
# 敏感信息通过环境变量注入（可创建 .env 文件），零硬编码
services:
  mysql:
    image: mysql:8.0
    container_name: micro-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-micro123456}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d

  redis:
    image: redis:7.2
    container_name: micro-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-micro123456}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: micro-nacos
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports:
      - "8848:8848"
      - "9848:9848"

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: micro-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: micro-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: micro-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-micro123456}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: micro-skywalking-oap
    restart: unless-stopped
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      SW_STORAGE: h2

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: micro-skywalking-ui
    restart: unless-stopped
    depends_on:
      - skywalking-oap
    ports:
      - "8080:8080"
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800

  # XXL-Job 调度中心（服务端通过 docker 部署，不进项目仓库）
  # 首次启动需先初始化官方 xxl_job 库脚本（挂载到 /docker-entrypoint-initdb.d 或手动导入）
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: micro-xxl-job-admin
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8081:8080"
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-micro123456}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-micro-cloud-token}

  # Seata TC 事务协调器（注册到 Nacos，业务服务通过 SEATA_GROUP 发现）
  seata-server:
    image: seataio/seata-server:2.0.0
    container_name: micro-seata-server
    restart: unless-stopped
    depends_on:
      - nacos
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      SEATA_IP: host.docker.internal
      STORE_MODE: db
      SEATA_PORT: 8091

volumes:
  mysql-data:
  redis-data:
  minio-data:
