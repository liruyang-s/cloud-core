spring:
  application:
    name: micro-gateway
  cloud:
    nacos:
      # Nacos 鉴权账号（开启鉴权后必需，通过环境变量注入）
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        # 本地模式：NACOS_DISCOVERY_ENABLED=false 可脱离注册中心启动
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        file-extension: yaml
        # 本地模式：NACOS_CONFIG_ENABLED=false 时不拉取远程配置，使用本地 application.yml
        enabled: ${NACOS_CONFIG_ENABLED:true}
    gateway:
      # 基于注册中心自动发现路由（服务名即路由 ID）
      discovery:
        locator:
          enabled: false
      # 按服务前缀精准路由，前端请求统一经网关转发
      routes:
        - id: micro-auth
          uri: lb://micro-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: micro-user
          uri: lb://micro-user
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
        - id: micro-file
          uri: lb://micro-file
          predicates:
            - Path=/file/**
          filters:
            - StripPrefix=1
        - id: micro-message
          uri: lb://micro-message
          predicates:
            - Path=/message/**
          filters:
            - StripPrefix=1
        - id: micro-demo
          uri: lb://micro-demo
          predicates:
            - Path=/demo/**
          filters:
            - StripPrefix=1

# Knife4j 网关聚合文档
# 生产环境部署时设置 KNIFE4J_PRODUCTION=true 关闭文档（或通过 Nacos 覆盖）
knife4j:
  production: ${KNIFE4J_PRODUCTION:false}
  gateway:
    enabled: true
    strategy: manual
    routes:
      - name: micro-user
        url: /user/v3/api-docs
        service-name: micro-user
        context-path: /user
      - name: micro-file
        url: /file/v3/api-docs
        service-name: micro-file
        context-path: /file
      - name: micro-demo
        url: /demo/v3/api-docs
        service-name: micro-demo
        context-path: /demo
