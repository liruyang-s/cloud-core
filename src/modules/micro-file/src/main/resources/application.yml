server:
  port: 9300

spring:
  application:
    name: micro-file
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# MinIO 对象存储配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:micro-cloud}

# Knife4j 接口文档
knife4j:
  enable: true
  setting:
    language: zh_cn

# Actuator 监控端点（k8s 存活/就绪探针）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    com.micro.cloud.file: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
