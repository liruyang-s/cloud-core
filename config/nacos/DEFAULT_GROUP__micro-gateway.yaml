server:
  port: 8080

spring:
  application:
    name: micro-gateway
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8085}
      # 网关限流规则持久化到 Nacos，支持动态下发
      datasource:
        gw-flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            namespace: ${NACOS_NAMESPACE:dev}
            data-id: ${spring.application.name}-gw-flow
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: gw-flow
  # Redis（Sa-Token 会话集中存储）
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:micro123456}
      database: 0

# Sa-Token 配置（网关与业务服务共用 Redis 会话）
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-header: true
  is-read-cookie: false

# 网关 IP 黑名单（生产环境迁移至 Nacos 动态配置）
gateway:
  ip-blacklist:

# Actuator 监控端点（k8s 存活/就绪探针）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    com.micro.cloud.gateway: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
